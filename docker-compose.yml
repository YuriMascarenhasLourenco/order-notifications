services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: order-notifications-rabbitmq
    ports:
      - "5672:5672"       # RabbitMQ default port
      - "15672:15672"     # RabbitMQ management UI port
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
   